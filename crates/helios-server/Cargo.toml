[package]
name = "helios-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
# Compile SQLite into the binary instead of linking the system library.
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0.104"
# HTTP/1.1 only: TLS and HTTP/2 end at the reverse proxy.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
helios-core = { path = "../helios-core" }
quick_cache = { version = "0.7.0", default-features = false }
rusqlite = { version = "0.40.2", default-features = false, features = ["cache", "array", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "signal", "sync", "time", "io-util"] }
