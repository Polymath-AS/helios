[package]
name = "helios-daemon"
description = "Maintenance daemon for helios-server: auto-GC, integrity scrub, SQLite maintenance, metrics"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
helios-core = { path = "../helios-core" }
helios-log = { path = "../helios-log" }
http = "1.5"
http-body-util = "0.1.5"
hyper = { version = "1.11", default-features = false, features = ["client", "server", "http1"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "signal", "sync", "io-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
